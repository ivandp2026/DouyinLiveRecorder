name: Build Windows Multi-platform Danmaku Edition

on:
  workflow_dispatch:
  push:
    branches:
      - feature/danmaku-highlights

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install build dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller streamlink
          python -c "import streamlink; print('Streamlink', streamlink.__version__)"

      - name: Apply Douyu integrations
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python tools/apply_douyu_integration.py
          python tools/apply_douyu_streamlink.py
          Select-String -Path main.py -Pattern "DouyuDanmakuSession"
          Select-String -Path main.py -Pattern "resolve_douyu_stream"
          Select-String -Path config/config.ini -Pattern "是否开启斗鱼弹幕分析"
          if (Select-String -Path main.py -Pattern "get_douyu_info_data" -Quiet) { throw "Old Douyu video resolver is still routed from main.py" }

      - name: Download verified Douyin danmaku relay
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $asset = "https://github.com/jwwsjlm/douyinLive/releases/download/v2.0.24/douyinLive-v2.0.24-79453ece4a44-windows-amd64.zip"
          $expected = "cc1cc9df433337c62263d7925da77ab17622603bbb554f1c27d3cbe9048cce4f"
          Invoke-WebRequest -Uri $asset -OutFile douyinLive.zip
          $actual = (Get-FileHash douyinLive.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "douyinLive checksum mismatch: $actual" }
          Expand-Archive douyinLive.zip -DestinationPath relay -Force
          New-Item -ItemType Directory -Force vendor/douyinlive | Out-Null
          Copy-Item relay/douyinLive.exe vendor/douyinlive/douyinLive.exe
          Copy-Item relay/LICENSE vendor/douyinlive/LICENSE

      - name: Run tests
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m unittest discover -s tests -v
          python -m py_compile main.py src/danmaku.py src/douyu_danmaku.py src/douyu_streamlink.py tools/apply_douyu_integration.py tools/apply_douyu_streamlink.py
          python -c "from src.douyu_streamlink import normalize_douyu_url; assert normalize_douyu_url('https://www.douyu.com/5135383?dyshid=abc') == 'https://www.douyu.com/5135383'"

      - name: Build application
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          pyinstaller --noconfirm --clean --onedir --console --name DouyinLiveRecorder --collect-all streamlink --collect-all lxml --add-data "src/javascript;src/javascript" main.py
          Copy-Item config dist/DouyinLiveRecorder/config -Recurse -Force
          Copy-Item i18n dist/DouyinLiveRecorder/i18n -Recurse -Force
          Copy-Item vendor dist/DouyinLiveRecorder/vendor -Recurse -Force
          Copy-Item README.md,LICENSE dist/DouyinLiveRecorder/ -Force
          Copy-Item docs dist/DouyinLiveRecorder/docs -Recurse -Force

      - name: Bundle FFmpeg
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          choco install ffmpeg -y --no-progress
          $ffmpegExe = Get-ChildItem "C:\ProgramData\chocolatey\lib\ffmpeg\tools" -Filter ffmpeg.exe -Recurse | Select-Object -First 1
          if (-not $ffmpegExe) { throw "Could not locate the installed ffmpeg.exe" }
          New-Item -ItemType Directory -Force dist/DouyinLiveRecorder/ffmpeg | Out-Null
          Copy-Item $ffmpegExe.FullName dist/DouyinLiveRecorder/ffmpeg/ffmpeg.exe -Force
          & dist/DouyinLiveRecorder/ffmpeg/ffmpeg.exe -version

      - name: Verify packaged files
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if (-not (Test-Path dist/DouyinLiveRecorder/DouyinLiveRecorder.exe)) { throw "Application executable missing" }
          if (-not (Test-Path dist/DouyinLiveRecorder/ffmpeg/ffmpeg.exe)) { throw "FFmpeg missing" }
          if (-not (Test-Path dist/DouyinLiveRecorder/vendor/douyinlive/douyinLive.exe)) { throw "Douyin relay missing" }
          if (-not (Select-String -Path dist/DouyinLiveRecorder/config/config.ini -Pattern "是否开启斗鱼弹幕分析" -Quiet)) { throw "Douyu config missing" }
          $douyuPlugin = Get-ChildItem dist/DouyinLiveRecorder/_internal -Recurse -Filter douyu.py | Where-Object { $_.FullName -match "streamlink.*plugins" } | Select-Object -First 1
          if (-not $douyuPlugin) { throw "Packaged Streamlink Douyu plugin missing" }
          $streamlinkPackage = Get-ChildItem dist/DouyinLiveRecorder/_internal -Recurse | Where-Object { $_.FullName -match "streamlink" } | Select-Object -First 1
          if (-not $streamlinkPackage) { throw "Packaged Streamlink files missing" }
          Write-Host "Verified packaged Streamlink Douyu plugin: $($douyuPlugin.FullName)"

      - name: Create ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Compress-Archive -Path dist/DouyinLiveRecorder/* -DestinationPath LiveRecorder-Douyin-Douyu-Streamlink-Windows-x64.zip -CompressionLevel Optimal

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: LiveRecorder-Douyin-Douyu-Streamlink-Windows-x64
          path: LiveRecorder-Douyin-Douyu-Streamlink-Windows-x64.zip
          if-no-files-found: error
          retention-days: 30
